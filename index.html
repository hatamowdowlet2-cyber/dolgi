<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Долги и займы</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d4e89">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--card:#fff;--ink:#17212b;--mute:#66727f;--line:#d9dfe5;--green:#0f7a4d;--green-bg:#dff3e8;--red:#b3261e;--red-bg:#fbe3e0;--accent:#1d4e89;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19212a;--ink:#e8edf2;--mute:#93a0ad;--line:#2b3642;--green:#4cc48a;--green-bg:#17352a;--red:#ff8a80;--red-bg:#3b1f1d;--accent:#7fb2ee;--on-accent:#0c1722}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19212a;--ink:#e8edf2;--mute:#93a0ad;--line:#2b3642;--green:#4cc48a;--green-bg:#17352a;--red:#ff8a80;--red-bg:#3b1f1d;--accent:#7fb2ee;--on-accent:#0c1722}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.box small{color:var(--mute);display:block}
.box b{font-size:24px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.box.g b{color:var(--green)}.box.r b{color:var(--red)}
.net{margin:8px 2px 14px;color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;min-height:42px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;width:100%}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tabs button{flex:1;padding:8px 4px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
form{display:none;margin:12px 0}
form.open{display:block}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}
.seg button[aria-pressed="true"].o{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600}
.seg button[aria-pressed="true"].w{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:600}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:12px;margin-bottom:10px}
.item.w{border-left-color:var(--red)}
.item.done{opacity:.6;border-left-color:var(--line)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.amt{font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt{color:var(--green)}.item.w .amt{color:var(--red)}.item.done .amt{color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1;min-width:120px;font-size:14px}
.pay{display:none;margin-top:10px}
.pay.open{display:block}
.row{display:flex;gap:8px;margin-top:6px}
.row input{flex:1}.row button{white-space:nowrap}
.hist{font-size:13px;color:var(--mute);margin-top:8px}
.danger{color:var(--red)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:14px;color:var(--mute)}
.foot button{border:0;background:none;color:var(--accent);min-height:36px;padding:4px}
</style>
</head>
<body>
<main>
<h1>Долги и займы</h1>
<div class="sum">
  <div class="box g"><small>Мне должны</small><b id="sOwed">0</b></div>
  <div class="box r"><small>Я должен</small><b id="sOwe">0</b></div>
</div>
<div class="net" id="net"></div>

<button class="primary" id="toggleForm">+ Новая запись</button>
<form id="form" autocomplete="off">
  <div class="seg">
    <button type="button" class="o" data-dir="owed" aria-pressed="true">Мне должны</button>
    <button type="button" class="w" data-dir="owe" aria-pressed="false">Я должен</button>
  </div>
  <label for="fName">Имя</label>
  <input id="fName" list="names" maxlength="60" required>
  <datalist id="names"></datalist>
  <label for="fAmt">Сумма</label>
  <input id="fAmt" type="number" inputmode="decimal" min="0" step="any" required>
  <label for="fNote">Заметка (необязательно)</label>
  <input id="fNote" maxlength="120" placeholder="например: 2 пачки Marlboro">
  <div class="row"><button class="primary" type="submit">Сохранить</button></div>
</form>

<div class="tabs" role="group" aria-label="Фильтр">
  <button data-f="all" aria-pressed="true">Все</button>
  <button data-f="owed" aria-pressed="false">Мне должны</button>
  <button data-f="owe" aria-pressed="false">Я должен</button>
</div>

<div id="list"></div>
<div class="foot">
  <button id="toggleDone"></button>
  <button id="copyBtn">Скопировать список</button>
</div>
<div class="foot">
  <button id="expBtn">Сохранить копию в файл</button>
  <button id="impBtn">Загрузить копию</button>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
</div>
</main>

<script>
const KEY='dolgi_v1';
let data=load(),filter='all',dir='owed',showDone=false,openId=null,delId=null;
const $=id=>document.getElementById(id);

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const paid=d=>d.pays.reduce((s,p)=>s+p.a,0);
const rem=d=>Math.max(0,Math.round((d.amount-paid(d))*100)/100);
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dt=s=>s.split('-').reverse().join('.');

function render(){
  const sum=k=>data.filter(d=>d.dir===k).reduce((s,d)=>s+rem(d),0);
  const a=sum('owed'),b=sum('owe');
  $('sOwed').textContent=fmt(a);$('sOwe').textContent=fmt(b);
  const n=a-b;
  $('net').textContent=n===0?'В итоге: никто никому не должен':(n>0?'В итоге вам должны ':'В итоге вы должны ')+fmt(Math.abs(n));
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===filter));
  const names=[...new Set(data.map(d=>d.name))];
  $('names').innerHTML=names.map(n=>'<option value="'+esc(n)+'">').join('');
  let items=data.filter(d=>(filter==='all'||d.dir===filter)&&(showDone||rem(d)>0));
  items.sort((x,y)=>(rem(y)>0)-(rem(x)>0)||y.date.localeCompare(x.date));
  const doneCount=data.filter(d=>rem(d)===0).length;
  $('toggleDone').textContent=doneCount?(showDone?'Скрыть закрытые':'Показать закрытые ('+doneCount+')'):'';
  if(!items.length){$('list').innerHTML='<div class="empty">Пока пусто. Нажмите «+ Новая запись».</div>';return}
  $('list').innerHTML=items.map(d=>{
    const r=rem(d),done=r===0,pct=Math.min(100,paid(d)/d.amount*100);
    const lbl=d.dir==='owed'?'Вернул(а)':'Я вернул';
    const hist=d.pays.length?'<div class="hist">'+d.pays.map(p=>dt(p.d)+': '+fmt(p.a)).join(' · ')+'</div>':'';
    return '<div class="item '+(d.dir==='owe'?'w ':'')+(done?'done':'')+'">'
     +'<div class="top"><div><div class="name">'+esc(d.name)+'</div><div class="meta">'+dt(d.date)+(d.note?' · '+esc(d.note):'')+'</div></div>'
     +'<div class="amt">'+(done?'закрыто':fmt(r))+'</div></div>'
     +(d.pays.length?'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="meta">Всего '+fmt(d.amount)+', возвращено '+fmt(paid(d))+'</div>':'<div style="height:10px"></div>')
     +'<div class="acts">'+(done?'':'<button data-act="pay" data-id="'+d.id+'">'+lbl+'</button>')
     +'<button class="danger" data-act="del" data-id="'+d.id+'">'+(delId===d.id?'Точно удалить?':'Удалить')+'</button></div>'
     +'<div class="pay'+(openId===d.id?' open':'')+'"><div class="row"><input type="number" inputmode="decimal" min="0" step="any" placeholder="Сколько вернули" id="p'+d.id+'">'
     +'<button data-act="ok" data-id="'+d.id+'">Записать</button></div>'
     +'<div class="row"><button data-act="all" data-id="'+d.id+'" style="flex:1">Вернули всё ('+fmt(r)+')</button></div></div>'
     +hist+'</div>';
  }).join('');
}

function pay(id,amount){
  const d=data.find(x=>x.id===id);if(!d)return;
  const a=Math.min(amount,rem(d));
  if(!(a>0))return;
  d.pays.push({a:a,d:today()});openId=null;save();render();
}

$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.id,act=b.dataset.act;
  if(act==='pay'){openId=openId===id?null:id;delId=null;render();if(openId){const i=$('p'+id);i&&i.focus()}}
  else if(act==='ok'){pay(id,parseFloat($('p'+id).value))}
  else if(act==='all'){pay(id,rem(data.find(x=>x.id===id)))}
  else if(act==='del'){
    if(delId===id){data=data.filter(x=>x.id!==id);delId=null;save()}else delId=id;
    render();
  }
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  dir=b.dataset.dir;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
$('toggleForm').onclick=()=>{const f=$('form');f.classList.toggle('open');if(f.classList.contains('open'))$('fName').focus()};
$('toggleDone').onclick=()=>{showDone=!showDone;render()};
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('fName').value.trim(),amount=parseFloat($('fAmt').value);
  if(!name||!(amount>0))return;
  data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),dir:dir,name:name,amount:amount,note:$('fNote').value.trim(),date:today(),pays:[]});
  save();$('form').reset();$('form').classList.remove('open');render();
});
$('copyBtn').onclick=()=>{
  const lines=data.filter(d=>rem(d)>0).map(d=>(d.dir==='owed'?'Мне должен ':'Я должен ')+d.name+': '+fmt(rem(d))+(d.note?' ('+d.note+')':''));
  const t=lines.length?lines.join('\n'):'Долгов нет';
  const done=()=>{$('copyBtn').textContent='Скопировано';setTimeout(()=>$('copyBtn').textContent='Скопировать список',1500)};
  try{navigator.clipboard.writeText(t).then(done,()=>{})}catch(e){}
};
$('expBtn').onclick=()=>{try{
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dolgi-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}catch(e){}};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;
    const ids=new Set(data.map(x=>x.id));
    arr.forEach(x=>{if(x&&x.id&&!ids.has(x.id)&&x.name&&x.amount>0&&Array.isArray(x.pays)&&(x.dir==='owed'||x.dir==='owe'))data.push(x)});
    save();render();$('impBtn').textContent='Загружено';
  }catch(err){$('impBtn').textContent='Ошибка файла'}
  setTimeout(()=>$('impBtn').textContent='Загрузить копию',2000)};
  r.readAsText(f);e.target.value='';};
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
